<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/navigation :: favicon}"></th:block>
    <title th:text="'Payment Slip - ' + ${vendor.name} + ' - SKSE Inventory'">Payment Slip - SKSE Inventory</title>
    <style>
        @page { margin: 0.4in; size: auto; }
        @media print { .no-print { display: none; } body { margin: 0; } }

        body { font-family: Arial, sans-serif; margin: 10px; font-size: 9pt; font-weight: 700; }

        .header { border: 2px solid #000; padding: 6px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .header-title { font-size: 13pt; font-weight: bold; line-height: 1.1; }
        .header-info { font-size: 9pt; line-height: 1.2; }
        .header-info span + span { margin-left: 10px; }
        .header-total { font-size: 12pt; font-weight: bold; }

        .tasks-table { width: 100%; border-collapse: collapse; font-size: 9pt; }
        .tasks-table th { background: #000; color: #fff; padding: 4px 6px; text-align: left; font-size: 9pt; font-weight: 800; white-space: nowrap; border: 1px solid #000; }
        .tasks-table td { padding: 3px 6px; border: 1px solid #000; font-weight: 700; white-space: nowrap; }
        .tasks-table tr:nth-child(even) { background: #eee; }
        .tasks-table .total-row td { border: 2px solid #000; padding: 5px 6px; font-weight: 900; font-size: 10pt; }

        .no-tasks { text-align: center; padding: 20px; border: 1px solid #000; margin: 10px 0; font-size: 11pt; }

        .btn { padding: 8px 16px; margin: 4px; border: 1px solid #000; background: white; cursor: pointer; font-weight: bold; font-size: 11pt; }
        .btn:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <div class="no-print" style="text-align: center; margin-bottom: 10px;">
        <form style="display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px;">
            <input type="hidden" name="vendorId" th:value="${vendorId}">
            <label for="month" style="font-weight: bold;">Month:</label>
            <input type="month" id="month" name="month" th:value="${selectedMonth}" style="padding: 4px 8px; font-size: 11pt; border: 1px solid #000; font-weight: bold;">
            <button type="submit" class="btn">Load</button>
        </form>
        <br>
        <button class="btn" onclick="window.print()">Print</button>
        <button class="btn" onclick="window.close()">Close</button>
    </div>

    <div class="header">
        <div>
            <div class="header-title" th:text="${vendor.name}">Vendor Name</div>
            <div class="header-info">
                <span th:text="${vendor.role}">Cutting</span>
                <span th:text="${period}">October 2026</span>
                <span th:text="'Issued: ' + ${#temporals.format(#temporals.createNow(), 'dd/MM/yy')}">Issued: 28/10/26</span>
            </div>
        </div>
        <div class="header-total" th:text="'Total: ₹' + ${#numbers.formatDecimal(totalPaymentDue, 1, 2)}">Total: ₹0.00</div>
    </div>

    <div th:if="${tasks.isEmpty()}" class="no-tasks">
        No completed tasks in <span th:text="${period}"></span>.
    </div>

    <table th:if="${!tasks.isEmpty()}" class="tasks-table">
        <thead>
            <tr>
                <th>Plan</th>
                <th>Period</th>
                <th>Article</th>
                <th style="text-align: right;">Qty</th>
                <th style="text-align: right;">Rate</th>
                <th style="text-align: right;">Amt</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.planNumber}">2892</td>
                <td th:text="${(task.startDate != null ? #temporals.format(task.startDate, 'dd/MM') : '') + '-' + (task.endDate != null ? #temporals.format(task.endDate, 'dd/MM') : '')}">01/10-15/10</td>
                <td th:text="${task.articleName}">KIRAN-13</td>
                <td style="text-align: right;" th:text="${task.quantity}">360</td>
                <td style="text-align: right;"><span th:if="${task.rateHeadCost > 0}" th:text="'₹' + ${#numbers.formatDecimal(task.rateHeadCost, 1, 2)}">₹18.00</span><span th:if="${task.rateHeadCost <= 0}">-</span></td>
                <td style="text-align: right;" th:text="'₹' + ${#numbers.formatDecimal(task.paymentDue, 1, 2)}">₹6,480.00</td>
            </tr>
            <tr class="total-row">
                <td colspan="3" style="text-align: right;">TOTAL</td>
                <td style="text-align: right;" th:text="${totalQuantity}">720</td>
                <td></td>
                <td style="text-align: right;" th:text="'₹' + ${#numbers.formatDecimal(totalPaymentDue, 1, 2)}">₹12,960.00</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
